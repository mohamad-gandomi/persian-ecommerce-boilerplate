services:
  postgres:
    image: postgres:16-alpine
    container_name: boilerplate-postgres
    restart: always
    environment:
      POSTGRES_USER: boilerplate_user
      POSTGRES_PASSWORD: boilerplate_password
      POSTGRES_DB: boilerplate_db
    ports:
      - "5432:5432"
    volumes:
      - boilerplate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerplate_user -d boilerplate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: boilerplate-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@store.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  boilerplate_pgdata:
    driver: local
